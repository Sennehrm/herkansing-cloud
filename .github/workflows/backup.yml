name: Automated 2-Day Backup

on:
  schedule:
    # Draait elke 2 dagen om 00:00 UTC
    - cron: '0 0 */2 * *'
  workflow_dispatch: # Maakt het ook mogelijk om de backup handmatig met 1 klik te testen op GitHub

permissions:
  contents: write

jobs:
  backup:
    name: Backup naar backup-branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configureer Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Maak backup en overschrijf backup-branch
        run: |
          # Switch naar een orphan backup branch en overschrijf deze forceerbaar
          git checkout --orphan backup
          git add -A
          git commit -m "Automated Backup: $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes to commit"
          git push origin backup --force
